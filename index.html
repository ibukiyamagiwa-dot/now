/* VOICE: 試作の作業台　遊べる戦闘画面が主役で、調整盤が横に控える
   IDEA: 開発機の画面と、その横に置いたパラメーター表
   PICTURE: 松明の灯る石の回廊で、騎士と魔物が向き合う戦闘画面
   COLOUR and TYPE: 葡萄酒色の闇、鋼の白、パリィの青白い閃光 / DotGothic16 と Noto Sans JP
   LAYOUT: 900px以上は戦闘画面と調整盤の2列、それ未満は縦に積む */
:root{color-scheme:dark;--bg:#160b11;--panel:#221520;--line:#3d2836;--ink:#efe6e8;--mute:#bba9b0;--acc:#7fe3ff;--gold:#e8c46a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "PxFont","DotGothic16",monospace;overflow-x:clip}
header{padding:14px max(3vw,14px) 6px;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
h1{font:30px/1.1 "PxFont","DotGothic16",monospace;margin:0}
header p{margin:0;color:var(--mute);font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:6px max(3vw,14px) 28px}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 330px}}
body.nodev .wrap{grid-template-columns:minmax(0,1fr);max-width:1100px;margin:0 auto}
body.nodev aside.panel{display:none}
.stage{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:start}
canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:15px "PxFont","DotGothic16",monospace;color:var(--ink);background:#2e1d29;border:1px solid #5a4050;border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.38;cursor:default}
.menu{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cm{font-size:13px;min-height:40px;padding:0 10px}
.cm.big{font-size:18px;min-height:48px;padding:0 18px}
.cm.on{border-color:var(--gold);background:#4a2a3a;box-shadow:0 0 0 2px var(--gold) inset}
#def{margin-left:auto;background:#123542;border-color:#2f7d96;min-width:160px;font-size:17px;user-select:none;-webkit-user-select:none}
#msg{flex-basis:100%;font:16px "PxFont","DotGothic16",monospace;color:var(--gold);min-height:24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;align-self:start}
.panel h2{font:19px "PxFont","DotGothic16",monospace;margin:0 0 2px}
.note{color:var(--mute);font-size:13px;margin:0 0 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;margin:6px 0;align-items:center}
.row label{font-size:13px}
.row output{text-align:right;font:14px "PxFont","DotGothic16",monospace;color:var(--acc);white-space:nowrap}
.row input{grid-column:1/-1;width:100%;accent-color:var(--acc);height:26px;margin:0}
.derived{font-size:13px;color:var(--mute);margin:2px 0 4px}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0;cursor:pointer}
.tg input{width:20px;height:20px;accent-color:var(--acc);margin:0}
textarea{width:100%;height:120px;background:#140a10;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px/1.4 "PxFont",monospace;padding:6px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btns button{font-size:13px;min-height:40px;padding:0 10px}
.stats{white-space:pre-line;font:13px/1.6 "PxFont","DotGothic16",monospace;color:var(--mute);margin:12px 0 0}
@media(max-width:600px){h1{font-size:23px}#def{flex-basis:100%;margin-left:0;min-height:56px}}
.stage{position:relative}
.cvbox{position:relative}
#mMenu,#mhud,#mmsg,#pad{display:none}
/* オーバーレイ（タイトル・メニュー） */
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:rgba(8,3,8,.74);font-family:"PxFont","DotGothic16",monospace;overflow:auto}
.ov[hidden]{display:none}
.ov.title{justify-content:flex-start;padding-top:min(7%,48px);background:linear-gradient(rgba(10,4,8,.6),rgba(10,4,8,.05) 45%,rgba(10,4,8,.8))}
.ov.title .list{margin-top:auto;width:min(340px,100%)}
.logo{text-align:center}
.logo h2{font:clamp(46px,9vw,84px)/1.05 "PxFont","DotGothic16",monospace;margin:0;background:linear-gradient(#fff3b0,#e8a84a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #120509) drop-shadow(0 0 2px #120509)}
.logo p{color:#bff4ff;margin:6px 0 0;font-size:20px;text-shadow:0 2px 0 #120509}
.list{display:flex;flex-direction:column;gap:8px;width:min(460px,100%)}
.it{min-height:52px;font:22px "PxFont","DotGothic16",monospace;background:rgba(34,21,32,.92);border:2px solid #5a4050;border-radius:12px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.it.on{border-color:var(--gold);background:#4a2a3a;color:#fff3b0}
.it.set{justify-content:space-between;padding:0 6px 0 16px;cursor:pointer;font-size:20px}
.val{display:flex;align-items:center;gap:4px}
.val button{min-height:40px;width:40px;padding:0;font-size:16px}
.val b{min-width:4.6em;text-align:center;color:var(--acc);font-weight:400}
.ovh{font:30px "PxFont","DotGothic16",monospace;color:#fff3b0;margin:0 0 4px}
.ovhint{color:var(--mute);font:15px/1.5 "PxFont","DotGothic16",monospace;margin:2px 0 0;text-align:center;min-height:1.5em;text-shadow:0 1px 0 #120509}
.help{width:min(680px,100%);margin:0}
.help dt{color:var(--acc);font-size:16px;margin-top:10px}
.help dd{margin:2px 0 0;font:15px/1.5 "PxFont","DotGothic16",monospace}
.ver{position:absolute;right:12px;bottom:8px;color:#7a6870;font-size:13px;margin:0;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;z-index:5}
#mhud,#mmsg,#pad,.bar{transition:opacity .5s}
body.blk #mhud,body.blk #mmsg,body.blk #pad,body.blk .bar{opacity:0}
body:not(.mob) .ov.box .list{max-height:62vh;overflow:auto}
.it.lock{color:#6a5a62}
.ov.pg-practice .list{display:grid;grid-template-columns:1fr 1fr;width:min(620px,100%)}
.ov.pg-practice .list .it.set,.ov.pg-practice .list .it:last-child,.ov.pg-practice .list .it.wide{grid-column:1/-1}
.sep{grid-column:1/-1;font:14px "PxFont","DotGothic16",monospace;color:#b8a0c8;padding:8px 2px 0;border-bottom:1px solid #3e2c3c;text-align:left}
.it.two{flex-direction:column;gap:2px;white-space:normal;padding:6px 10px;line-height:1.25}
.it.two small{font:12px/1.35 "PxFont","DotGothic16",monospace;color:#bfaec8}
.it .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.ov.pg-pmv .list{display:grid;grid-template-columns:1fr 1fr;width:min(620px,100%)}
.ov.pg-pmv .list .it:first-child,.ov.pg-pmv .list .it:last-child{grid-column:1/-1}
.ov.pg-pmv .list .it{min-height:52px;font-size:17px}
.ov.pg-practice .list .it{font-size:18px;min-height:48px;white-space:nowrap}
#msg.hl{animation:msghl .65s ease-in-out 4 alternate}
@keyframes msghl{from{color:inherit;text-shadow:none}to{color:#fff3b0;text-shadow:0 0 8px #e8c46a}}
.pb em{font:13px/1.3 "PxFont","DotGothic16",monospace;font-style:normal;padding:1px 8px;border-radius:10px}
.pb em.good{color:#120509;background:#fff3b0}
.pb em.bad{color:#ffd0d0;background:#5a1f2a}
/* 記録 */
.rec{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-top:10px;font-size:15px;color:#efe6e8;text-shadow:0 2px 0 #120509}
.rec b{font-weight:400;color:#fff3b0;font-size:18px}
.goal{margin:2px 0 0;color:var(--gold);font-size:15px;text-shadow:0 2px 0 #120509}
.rank{font:96px/1 "PxFont","DotGothic16",monospace;filter:drop-shadow(0 4px 0 #120509)}
.res{display:grid;grid-template-columns:auto auto;gap:6px 18px;margin:4px 0 6px;font-size:18px}
.res dt{color:var(--mute)} .res dd{margin:0} .res b{font-weight:400} .res i{font-style:normal;color:#ff9a9a;font-size:14px;margin-left:8px}
.ov.clear .list{width:min(340px,100%)}
/* 解説カード */
#card{position:absolute;inset:0;z-index:4;overflow:hidden;cursor:pointer;touch-action:none}
#card[hidden]{display:none}
#card.nospot{background:rgba(5,2,5,.66)}
#card .spot{position:absolute;border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 300vmax rgba(5,2,5,.66);animation:spot 1s ease-in-out infinite;pointer-events:none}
#card .spot[hidden]{display:none}
@keyframes spot{50%{border-color:#fff3b0;box-shadow:0 0 0 300vmax rgba(5,2,5,.66),0 0 18px 4px rgba(255,243,176,.6)}}
#card .cbox{position:absolute;left:50%;transform:translateX(-50%);width:min(600px,92%);background:#1d1019;border:3px solid var(--gold);border-radius:10px;padding:14px 18px 10px;box-shadow:0 6px 0 rgba(0,0,0,.5)}
#card .ct{margin:0;font:21px/1.5 "PxFont","DotGothic16",monospace;color:#fff3b0;white-space:pre-line}
#card .cn{margin:8px 0 0;text-align:right;font:13px "PxFont","DotGothic16",monospace;color:var(--mute);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){#card .spot,#card .cn{animation:none}}
.hl{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px;animation:hl 1s ease-in-out infinite}
@keyframes hl{50%{outline-color:#fff3b0;box-shadow:0 0 12px rgba(255,243,176,.6)}}
/* スマホ */
body.mob{height:100dvh;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.mob header,body.mob aside.panel,body.mob .bar{display:none}
body.mob .wrap{display:block;padding:0;height:100%;max-width:none;margin:0}
body.mob .stage{height:100%;border:0;border-radius:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg)}
body.mob canvas{touch-action:none}
body.mob #mMenu{display:flex;position:absolute;top:6px;right:6px;width:44px;height:44px;min-height:0;padding:0;align-items:center;justify-content:center;font-size:22px;background:rgba(20,8,14,.62);border-color:rgba(255,255,255,.18);border-radius:10px;z-index:2}
body.mob #pad{display:flex;flex:1;flex-direction:column;gap:10px;padding:10px 12px 14px;touch-action:none;min-height:0}
body.mob.port #mhud{display:block;padding:8px 12px 0}
body.mob.port #mmsg{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px 12px 0;min-height:76px}
.mtop{display:flex;justify-content:space-between;font:14px "PxFont","DotGothic16",monospace;color:var(--mute);margin-bottom:6px}
#mTurn{font-size:16px}
#mTurn.you{color:var(--gold)} #mTurn.foe{color:#ff9a9a}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mnm{display:flex;justify-content:space-between;gap:6px;font:15px "PxFont","DotGothic16",monospace;white-space:nowrap}
.mnm span{color:var(--mute)}
.mnm b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.mg{height:12px;background:#0d0509;border:2px solid #5a4050;margin:3px 0 4px}
.mg i{display:block;height:100%;background:#6fd18c;transition:width .15s}
.mg.low i{background:#e2505c}
.mg.e i{background:#d8606b}
.msub{display:flex;justify-content:space-between;align-items:center;font:14px "PxFont","DotGothic16",monospace;min-height:20px}
#hPot{color:#8dffb0;white-space:nowrap}
.psn{color:#c98ae8;font-weight:400;margin-left:8px}
.seg{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.seg i{width:22px;height:10px;border:2px solid #5a4050;background:#0d0509;position:relative}
.seg i.f{background:#7fe3ff;border-color:#7fe3ff}
.seg i.p{background:linear-gradient(90deg,#2f6f86 var(--w),#0d0509 var(--w))}
#hMk{color:var(--acc)} #hMk.fl{color:#fff}
#eSub{color:#e8c46a}
#mPrompt{font:20px/1.3 "PxFont","DotGothic16",monospace;color:#fff3b0;text-align:center;border:3px solid var(--acc);background:rgba(12,5,9,.85);padding:8px 10px;border-radius:6px}
#mPrompt:empty,#mTip:empty{display:none}
#mPrompt.ok{border-color:#fff3b0}
#mTip{font:15px/1.4 "PxFont","DotGothic16",monospace;color:#fff3b0;text-align:center;border:2px solid var(--gold);padding:6px 10px;border-radius:6px;background:rgba(12,5,9,.85)}
#mLine{font:15px/1.4 "PxFont","DotGothic16",monospace;color:var(--gold);text-align:center}
.pb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:26px "PxFont","DotGothic16",monospace;border-radius:16px;border:2px solid #5a4050;background:#2e1d29;color:var(--ink);touch-action:none;min-height:0;padding:4px;transition:transform .05s,filter .05s}
.pb small{font:13px/1.3 "PxFont","DotGothic16",monospace;color:var(--mute)}
.pb.main{flex:1.5;background:#3a2232;border-color:var(--gold);font-size:34px}
.prow{flex:1;display:flex;gap:10px;min-height:0}
.prow .pb{flex:1;font-size:22px}
.pb.a{background:radial-gradient(circle at 50% 45%,#1f5163,#0e2630);border-color:#2f7d96;font-size:40px}
.pb.a.idle{background:#1a1016;border-color:#3d2836;color:var(--mute);font-size:28px}
.pb.pr{transform:scale(.97);filter:brightness(1.45)}
.pb:disabled{opacity:.32}
body.mob:not(.port) .stage{flex-direction:row;align-items:stretch}
body.mob:not(.port) .cvbox{height:100%;flex:0 0 auto}
body.mob:not(.port) canvas{height:100%;width:auto}
body.mob:not(.port) #pad{flex:1;min-width:140px;padding:10px}
body.mob:not(.port) .pb.main{font-size:26px} body.mob:not(.port) .prow{flex-direction:column} body.mob:not(.port) .prow .pb{font-size:18px}
body.mob:not(.port) .pb small{display:none}
body.mob .ov{padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
body.mob .ov.title .list{margin-bottom:12px}
body.mob .it{min-height:58px}
body.mob.intitle #mhud,body.mob.intitle #mmsg,body.mob.intitle #pad,body.mob.intitle #mMenu{visibility:hidden}
body.mob.port canvas{aspect-ratio:4/3;object-fit:cover}
body.mob .ov{background:rgba(8,3,8,.9);justify-content:safe center}
body.mob .ov.title{background:linear-gradient(rgba(10,4,8,.6),rgba(10,4,8,.05) 30%,rgba(10,4,8,.92) 55%)}
body.mob .it.set{font-size:17px;padding-left:12px}
body.mob .val b{min-width:3.8em}
body.mob .ver{position:static;align-self:center;margin:2px 0 0;padding:6px 12px calc(4px + env(safe-area-inset-bottom));font-size:12px}
body.mob:not(.port) #mMenu{top:auto;bottom:6px}
body.mob:not(.port) .ov.title{padding-top:12px;gap:6px;background:linear-gradient(rgba(10,4,8,.6),rgba(10,4,8,0) 35%,rgba(10,4,8,0) 60%,rgba(10,4,8,.8))}
body.mob:not(.port) .ov.title .logo h2{font-size:44px}
body.mob:not(.port) .ov.title .logo p{font-size:16px;margin-top:2px}
body.mob:not(.port) .ov.title .list{display:grid;grid-template-columns:1fr 1fr;width:min(520px,100%);margin-bottom:0}
body.mob:not(.port) .it{min-height:48px;font-size:19px}

#devp{position:fixed;inset:0;z-index:50;background:#120509;color:#efe6e8;font-family:"PxFont","DotGothic16",monospace;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
#devp[hidden]{display:none}
#devp .dw{max-width:720px;margin:0 auto}
#devp h2{font-size:22px;margin:4px 0 10px;color:#fff3b0;display:flex;justify-content:space-between;align-items:center}
#devp h3{font-size:17px;margin:18px 0 8px;color:#7fe3ff;border-bottom:1px solid #3a2530;padding-bottom:4px}
#devp button{font:inherit;font-size:16px;background:#2a1520;color:#efe6e8;border:1px solid #6a4a58;border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
#devp button.go{background:#3a5a2a;border-color:#8dffb0;color:#fff}
#devp button.x{min-width:44px}
#devp select,#devp input[type=password]{font:inherit;font-size:16px;background:#1d0d14;color:#efe6e8;border:1px solid #6a4a58;border-radius:8px;padding:9px;min-height:44px}
#devp .rw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
#devp label.ck{display:flex;align-items:center;gap:8px;font-size:15px;min-height:36px}
#devp label.ck input{width:22px;height:22px}
#devp .pr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:8px 0;border-bottom:1px solid #26141c}
#devp .pr .nm{font-size:14px}#devp .pr .vl{font-size:15px;color:#fff3b0;text-align:right}
#devp .pr .ct{grid-column:1/3;display:flex;gap:6px;align-items:center}#devp .pr input[type=range]{flex:1;min-width:0}
#devp .note{font-size:13px;color:#bba9b0;margin:4px 0}
#devp .err{color:#ff7b86;min-height:1.4em}
#devp textarea{width:100%;height:120px;background:#1d0d14;color:#efe6e8;border:1px solid #6a4a58;border-radius:8px;font-size:12px}
button:not(.cm):not(#def):active,.it:active,.row:active,[data-dv]:active{transform:scale(.95);filter:brightness(1.35)}
button,.it,.row,[data-dv]{transition:transform .05s,filter .05s}

<body>
<header>
  <h1>いまだ！　試作</h1>
  <p>ボタンは A（Space）ひとつ　Esc／P でメニュー</p>
</header>
<div class="wrap">
  <section class="stage" aria-label="戦闘画面">
    <div class="cvbox"><canvas id="cv" width="960" height="540"></canvas><button id="mMenu" aria-label="メニュー">≡</button></div>
    <div id="mhud">
      <div class="mtop"><span id="mStage"></span><span id="mTurn"></span></div>
      <div class="mrow">
        <div><div class="mnm"><b>騎士</b><span id="hHp"></span></div><div class="mg" id="hG"><i id="hBar"></i></div><div class="msub"><span id="hMk"></span><span id="hPot"></span></div></div>
        <div><div class="mnm"><b id="eNm"></b><span id="eHp"></span></div><div class="mg e"><i id="eBar"></i></div><div class="msub"><span id="eSub"></span></div></div>
      </div>
    </div>
    <div id="mmsg"><div id="mPrompt"></div><div id="mTip"></div><div id="mLine"></div></div>
    <div id="pad" role="group" aria-label="操作"></div>
    <div class="bar">
      <div id="msg" role="status">…</div>
      <div class="menu" role="group" aria-label="コマンド">
        <button id="c1" class="cm big">たたかう</button>
        <button id="c2" class="cm">まほう</button>
        <button id="c3" class="cm">かいふく</button>
      </div>
      <button id="menuBtn">メニュー</button>
      <button id="skipTut">チュートリアルを飛ばす</button>
      <button id="def">A</button>
    </div>
    <div id="card" hidden><div class="spot"></div><div class="cbox"><p class="ct"></p><p class="cn"></p></div></div>
    <div id="ov" class="ov" hidden></div>
  </section>
  <aside class="panel" aria-label="調整盤">
    <h2>調整盤</h2>
    <p class="note">単位はフレーム（60F＝1秒）　動かすと次の攻撃から反映　数値はこのブラウザに自動保存されます</p>
    <div id="main"></div>
    <div class="derived" id="der"></div>
    <details open><summary>見切りゲージと追撃</summary><div id="gauge"></div><div class="derived" id="der2"></div></details>
    <details open><summary>とどめの演出</summary><div id="ko"></div></details>
    <details><summary>細かい項目</summary><div id="adv"></div></details>
    <details open><summary>デバッグ</summary>
      <label class="tg"><input type="checkbox" id="dBar">受付バーと着弾リングを表示</label>
      <label class="tg"><input type="checkbox" id="dSlow">スロー（1/4倍）</label>
      <label class="tg"><input type="checkbox" id="dGod">自分が倒れない</label>
      <label class="tg"><input type="checkbox" id="dFix">敵の行動を固定（いつも同じ溜め）</label>
      <label class="tg"><input type="checkbox" id="dAll">すべての技を使う（解放を無視）</label>
      <div class="btns"><button id="bPrev">前の敵</button><button id="bNext">次の敵</button><button id="bRe">この戦闘をやり直す</button><button id="bMk">見切り＋1段</button><button id="bTut">チュートリアル</button><button id="bSoul">魂＋5</button><button id="bForget">技を忘れる</button></div>
    </details>
    <details><summary>数値の書き出し・読み込み</summary>
      <textarea id="json" spellcheck="false" aria-label="パラメーターのJSON"></textarea>
      <div class="btns"><button id="bCopy">コピー</button><button id="bLoad">貼った内容を読み込む</button><button id="bReset">初期値に戻す</button></div>
    </details>
    <p class="stats" id="stats"></p>
  </aside>
</div>
<script>
{
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== パラメーター表（仕様書の【】名＝そのままキー） ===== */
const DEF=[
 {k:'parryF',n:'【パリィの受付フレーム】',v:6,min:1,max:20,step:1,u:'F',g:'main'},
 {k:'justMul',n:'【ジャスト回避の受付倍率】',v:2,min:1,max:4,step:.5,u:'×',g:'main'},
 {k:'guardF',n:'【ガードの受付フレーム】',v:30,min:8,max:60,step:1,u:'F',g:'main'},
 {k:'cueF',n:'【予兆から着弾までのフレーム】',v:28,min:10,max:60,step:1,u:'F',g:'main'},
 {k:'parryStopF',n:'【パリィ時のヒットストップフレーム】',v:12,min:0,max:30,step:1,u:'F',g:'main'},
 {k:'shake',n:'【画面振動の強さ】',v:10,min:0,max:30,step:1,u:'',g:'main'},
 {k:'counterMul',n:'【反撃の倍率】',v:1.5,min:0,max:4,step:.1,u:'×',g:'main'},
 {k:'golemBeatF',n:'【岩の巨人：ゴンの間隔フレーム】',v:13,min:4,max:16,step:1,u:'F',g:'adv'},
 {k:'golemLastF',n:'【岩の巨人：最後のゴンから当たるまでのフレーム】',v:8,min:2,max:16,step:1,u:'F',g:'adv'},
 {k:'earlyLockF',n:'【早押しの硬直フレーム】',v:24,min:0,max:60,step:1,u:'F',g:'adv'},
 {k:'hitStopF',n:'【被弾時のヒットストップフレーム】',v:6,min:0,max:30,step:1,u:'F',g:'adv'},
 {k:'guardDmgMul',n:'【ガード時の被ダメージ倍率】',v:.5,min:0,max:1,step:.05,u:'×',g:'adv'},
 {k:'potCap',n:'【薬の所持上限】',v:3,min:1,max:9,step:1,u:'',g:'adv'},
 {k:'winHeal',n:'【勝利後のHP回復量】',v:0,old:[30],min:0,max:100,step:5,u:'',g:'adv'},
 {k:'retryHp',n:'【やり直し時の最低HP】',v:40,min:1,max:100,step:5,u:'',g:'adv'},
 {k:'breakNeed',n:'【ブレイクに必要なパリィ回数】',v:4,old:[3],min:1,max:10,step:1,u:'回',g:'adv'},
 {k:'breakMul',n:'【ブレイク中の与ダメージ倍率】',v:1.5,old:[2],min:1,max:4,step:.1,u:'×',g:'adv'},
 {k:'enemyAtkMul',n:'【敵の攻撃力倍率】',v:1,min:.2,max:3,step:.1,u:'×',g:'adv'},
 {k:'heroAtk',n:'【たたかうの攻撃力】',v:12,min:1,max:60,step:1,u:'',g:'adv'},
 {k:'mkParry',n:'【パリィの見切り獲得量】',v:50,min:0,max:100,step:5,u:'',g:'gauge'},
 {k:'mkJust',n:'【ジャストの見切り獲得量】',v:25,min:0,max:100,step:5,u:'',g:'gauge'},
 {k:'mkHit',n:'【被弾時の見切り減少量】',v:50,min:0,max:100,step:5,u:'',g:'gauge'},
 {k:'magBase',n:'【まほう1段の威力】',v:26,min:1,max:100,step:1,u:'',g:'gauge'},
 {k:'tutSlow',n:'【チュートリアルのスロー倍率】',v:1,min:1,max:3,step:.1,u:'×',g:'adv'},
 {k:'mkCarry',n:'【勝利後の見切り持ち越し率】',v:80,min:0,max:100,step:10,u:'%',g:'gauge'},
 {k:'atkHoldF',n:'【たたかうの振りかぶりフレーム】',v:8,min:0,max:60,step:1,u:'F',g:'gauge'},
 {k:'magBonus',n:'【段ごとの威力ボーナス】',v:.3,min:0,max:1.5,step:.1,u:'×',g:'gauge'},
 {k:'mkMiss',n:'【追撃失敗の見切り減少量】',v:25,min:0,max:100,step:5,u:'',g:'gauge'},
 {k:'missMul',n:'【早押し時の一撃目の倍率】',v:.5,min:0,max:1,step:.1,u:'×',g:'gauge'},
 {k:'chaseF',n:'【追撃の受付フレーム】',v:8,old:[5,6],min:1,max:14,step:1,u:'F',g:'gauge'},
 {k:'critF',n:'【重い一撃の受付フレーム】',v:3,old:[2],min:0,max:8,step:1,u:'F',g:'gauge'},
 {k:'lateF',n:'【追撃・重い一撃の遅れの許容フレーム】',v:2,min:0,max:6,step:1,u:'F',g:'gauge'},
 {k:'chaseMul',n:'【追撃の倍率】',v:.5,min:0,max:2,step:.1,u:'×',g:'gauge'},
 {k:'critMul',n:'【重い一撃の倍率】',v:2,min:0,max:3,step:.1,u:'×',g:'gauge'},
 {k:'hit1StopF',n:'【通常の一撃のヒットストップフレーム】',v:3,min:0,max:20,step:1,u:'F',g:'gauge'},
 {k:'chaseStopF',n:'【追撃のヒットストップフレーム】',v:8,min:0,max:30,step:1,u:'F',g:'gauge'},
 {k:'bite',n:'【ヒットストップ中の刃の食い込み】',v:.03,min:0,max:.1,step:.01,u:'',g:'gauge'},
 {k:'critStopF',n:'【重い一撃のヒットストップフレーム】',v:16,min:0,max:40,step:1,u:'F',g:'gauge'},
 {k:'mkCrit',n:'【重い一撃の見切り獲得量】',v:15,min:0,max:100,step:5,u:'',g:'gauge'},
 {k:'mkStreak',n:'【連続パリィ（3回以上）のボーナス見切り】',v:15,min:0,max:100,step:5,u:'',g:'adv'},
 {k:'autoNextF',n:'【勝利後に自動で次へ進むまでのフレーム】',v:80,min:20,max:240,step:10,u:'F',g:'adv'},
 {k:'koStopF',n:'【とどめのヒットストップフレーム】',v:26,old:[40],min:0,max:120,step:2,u:'F',g:'ko'},
 {k:'bossStopF',n:'【ボス撃破のヒットストップフレーム】',v:72,min:0,max:180,step:2,u:'F',g:'ko'},
 {k:'koSlowF',n:'【とどめ後のスローフレーム】',v:27,old:[45],min:0,max:120,step:5,u:'F',g:'ko'},
 {k:'koZoom',n:'【とどめのカメラ寄り】',v:2,min:0,max:2,step:1,u:'段',g:'ko'},
 {k:'koShake',n:'【とどめの画面振動】',v:24,min:0,max:40,step:1,u:'',g:'ko'},
];
const P={};DEF.forEach(d=>P[d.k]=d.v);
const justF=()=>Math.round((P.parryF+(typeof RM2==='object'&&RM2?RM2.parryW:0))*P.justMul);
const magDmg=lv=>P.magBase*lv*(1+P.magBonus*(lv-1))*(1+(typeof RM2==='object'&&RM2?RM2.magic:0));
const toJ=()=>{const o={};DEF.forEach(d=>o[d.n]=P[d.k]);return o};
const fmt=v=>Number.isInteger(v)?String(v):(+v.toFixed(2)).toString();
function applyJ(o){let n=0;for(const d of DEF){if(typeof o[d.n]==='number'){P[d.k]=Math.min(d.max,Math.max(d.min,o[d.n]));n++}}return n}
try{const s=JSON.parse(localStorage.getItem('parryRPG.P')||'null');if(s){for(const d of DEF)if(d.old&&d.old.includes(s[d.n]))delete s[d.n];applyJ(s)}}catch(e){}
function save(){try{const o={};DEF.forEach(d=>{if(P[d.k]!==d.v)o[d.n]=P[d.k]});localStorage.setItem('parryRPG.P',JSON.stringify(o))}catch(e){}}

function buildPanel(){
 for(const g of ['main','gauge','ko','adv']){
  $(g).innerHTML=DEF.filter(d=>d.g===g).map(d=>`<div class="row"><label for="p_${d.k}">${d.n}</label><output id="o_${d.k}"></output><input type="range" id="p_${d.k}" min="${d.min}" max="${d.max}" step="${d.step}"></div>`).join('');
 }
 DEF.forEach(d=>{const i=$('p_'+d.k);i.value=P[d.k];i.addEventListener('input',()=>{P[d.k]=+i.value;syncOut();save()})});
 syncOut();
}
function syncOut(){
 DEF.forEach(d=>{$('o_'+d.k).textContent=fmt(P[d.k])+d.u;$('p_'+d.k).value=P[d.k]});
 $('der').textContent=`→ ジャスト回避の受付：${justF()}F（パリィ×倍率）`;
 $('der2').textContent=`→ まほうの威力：ほのお ${Math.round(magDmg(1))}／かみなり ${Math.round(magDmg(2))}／ひかり ${Math.round(magDmg(3))}　追撃は敵と同じく、剣が光ってから${P.cueF}F後に着弾　着弾の${P.chaseF}F前から押すと追撃、${P.critF}F前から（剣が触れる瞬間）なら重い一撃`;
 $('json').value=JSON.stringify(toJ(),null,1);
}
const dbg={bar:false,slow:false,god:false,fix:false,all:false};
let CFG={guide:false,vol:7,bgm:5,shake:100,flash:100,dev:false,vib:true};
const MOB=matchMedia('(hover:none) and (pointer:coarse)').matches||/[?&]mob/.test(location.search);
let PORTV=false,UIS=1;

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function master(){if(!AC._m){AC._m=AC.createGain();AC._m.connect(AC.destination)}AC._m.gain.value=CFG.vol/10;return AC._m}
function tone(f,d,type,v,f2){const a=AC;if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(master());o.start(t);o.stop(t+d+.02)}
function sweep(d,v,f0,f1,q){const a=AC;if(!a)return;const n=Math.max(1,a.sampleRate*d|0),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n)**1.5;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=q||1;const t=a.currentTime;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(master());s.start()}
function noise(d,v,fq,type){const a=AC;if(!a)return;const n=Math.max(1,a.sampleRate*d|0),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n)**2;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=fq||2000;const g=a.createGain();g.gain.value=v||.2;s.connect(fl).connect(g).connect(master());s.start()}

/* ===== 打ち合い（門のぬし・赤い騎士・赤い門のぬし）=====
   1) 金に光る「誘いのひと振り」を弾いたときだけ「打ち合い！」が始まる（弾けなければ始まらない）
   2) 始まると両者が間合いに踏み込み、画面の上下が締まる。目盛りで残りの合が見える
   3) 弾くたびに刃がぶつかって火花、次のひと振りは28Fおき。最後のひと振りの前は押し合いで溜めて一拍遅れる

 /* 2合目以降の間合い：ふつう(+12)・詰め(+6)・溜め(+26)。最初・押し合い・最後は固定 */
 const mid=[];for(let i=2;i<n;i++)if(i!==dl)mid.push(i);
 const heavyAt=o.heavy&&mid.length?pick(mid):-1;
 /* フェイント：数で渡すと1回（その確率）。配列 [1回,2回,3回] で渡すと、回数ごとの確率で選び、入れる合をばらす（入れる合が足りなければその数まで） */
 let feints=new Set();
 if(Array.isArray(o.feint)){const r=Math.random();let acc=0,k=0;for(let j=o.feint.length-1;j>=0;j--){acc+=o.feint[j];if(r<acc){k=j+1;break}}k=Math.min(k,mid.length);if(k)feints=new Set(shuffle(mid.slice()).slice(0,k))}
 else if(o.feint&&mid.length&&Math.random()<o.feint)feints.add(pick(mid.filter(i=>i!==heavyAt).concat(mid.length===1?mid:[])));
 for(let i=1;i<=n;i++){const end=i===n,lk=i===dl,m2=arm&&i===2?'arm':i%2?'cut2':'cut';
  let g=R+(i===1?20:12)+(lk?18:0);if((o.vary||o.gapAll||o.gapAlt)&&i>=2&&!lk&&!end){const k=o.gapAll||(o.gapAlt?(i%2?'t':'m'):pick(['n','t','t','m']));g=k==='t'?R+6:k==='m'?R+26:g}
  if(feints.has(i)){L.push({fake:true,pre:6,mv:i%2?'cut':'cut2'});g=Math.max(g,R+32)}

 <div class="rw"><select id="dvEn">${opt(keys.map(k=>[k,EN[k].name+(EN[k].boss?'（ボス）':EN[k].mid?'（中ボス）':'')]),st.en)}</select><select id="dvPv">${opt([[0,'ふつう'],[1,'赤い'],[2,'黒い']],st.pv)}</select></div>
 <div class="rw"><label class="ck"><input type="checkbox" id="dvRage"${st.rage?' checked':''}>怒った状態から（ボス）</label><label class="ck"><input type="checkbox" id="dvMk"${st.mk?' checked':''}>見切りを満タンで</label></div>
 <div class="rw"><button class="go" data-dv="fight">この敵と戦う（練習）</button></div>
 <div class="rw"><select id="dvK">${opt(KAKU.map((k,i)=>[i,'覚悟'+i+' '+k.n]),st.K)}</select><select id="dvFl">${opt([1,2,3,4,5,6,7,8,9].map(i=>[i,'地下'+i+'階（いちばん奥：覚悟0は6階、1〜3は8階、4は9階）']).concat([[99,'隠しボス（三つ首）']]),st.fl)}</select></div>
 <div class="rw"><button class="go" data-dv="run">この階から本番を始める</button></div>
 <div class="rw"><select id="dvTut">${opt(TUT.map((t,i)=>[i,(t.key==='pro'?'最初の演出（竜）':i+'. '+t.title)]),st.tut)}</select><button data-dv="tut">チュートリアルのここから</button></div>
 <h3>デバッグ</h3>
 <div class="rw">${[['bar','受付バーと着弾リング'],['slow','スロー（1/4倍）'],['god','自分が倒れない'],['fix','敵の行動を固定']].map(([k,n])=>`<label class="ck"><input type="checkbox" data-dbg="${k}"${dbg[k]?' checked':''}>${n}</label>`).join('')}</div>
 <div class="rw"><button data-dv="unlock">すべて解放（覚悟・練習・チュートリアル済み）</button><button data-dv="wipe">記録を消す</button></div>
 <h3>調整</h3><p class="note">単位はフレーム（60F＝1秒）　次の攻撃から反映　このブラウザに保存されます</p>
 ${groups.map(([g,n])=>`<p class="note" style="color:#e8c46a;margin-top:12px">${n}</p>`+DEF.filter(x=>x.g===g).map(x=>`<div class="pr"><span class="nm">${x.n.replace(/[【】]/g,'')}</span><span class="vl" id="dvv_${x.k}">${fmt(P[x.k])}${x.u}</span><div class="ct"><button class="x" data-st="${x.k}" data-d="-1">−</button><input type="range" data-pk="${x.k}" min="${x.min}" max="${x.max}" step="${x.step}" value="${P[x.k]}"><button class="x" data-st="${x.k}" data-d="1">＋</button></div></div>`).join('')).join('')}
 <div class="rw" style="margin-top:12px"><button data-dv="reset">すべて初期値に戻す</button><button data-dv="copy">数値をコピー</button><button data-dv="load">貼った数値を読み込む</button></div>
 <textarea id="dvJson" spellcheck="false">${esc(JSON.stringify(toJ(),null,1))}</textarea>
 <div class="rw"><button data-dv="close">ゲームにもどる</button></div><p class="err" id="dvErr"></p></div>`}
function devSet(k,v){const x=DEF.find(q=>q.k===k);P[k]=Math.min(x.max,Math.max(x.min,+(+v).toFixed(4)));save();try{syncOut()}catch(e){}const o=$('dvv_'+k);if(o)o.textContent=fmt(P[k])+x.u;const r=document.querySelector(`#devp [data-pk="${k}"]`);if(r)r.value=P[k];const j=$('dvJson');if(j)j.value=JSON.stringify(toJ(),null,1)}
function devStart(){const d=$('devp'),st=d._st;st.en=$('dvEn').value;st.pv=+$('dvPv').value;st.rage=$('dvRage').checked;st.mk=$('dvMk').checked;st.K=+$('dvK').value;st.fl=+$('dvFl').value;st.tut=+$('dvTut').value}
function devAfter(){const d=$('devp'),st=d._st;G.card=null;G.cards=[];if(st.mk)G.hero.mk=100*lvMax();const e=G.en;if(st.rage&&e&&e.boss){e.rage=true;e.roared=true;G.state='roar';G.t=0}closeDev();closeMenu()}
document.addEventListener('click',e=>{const d=$('devp');if(!d||d.hidden||!d.contains(e.target))return;const b=e.target.closest('[data-dv],[data-st]');if(!b)return;ac();
 if(b.dataset.st){const x=DEF.find(q=>q.k===b.dataset.st);devSet(x.k,P[x.k]+(+b.dataset.d)*x.step);return}
 const a=b.dataset.dv;
 if(a==='close'){closeDev();return}
 if(a==='pw'){const v=$('dvPw').value;if(v===DEVPW){devOK=true;try{sessionStorage.setItem('parryRPG.devok','1')}catch(e){}devRender()}else{$('dvErr').textContent='パスワードがちがいます';$('dvPw').value='';tone(200,.08,'square',.05)}return}
 if(a==='fight'){devStart();const st=d._st;PV=st.pv;startPractice(st.en);devAfter();return}
 if(a==='run'){devStart();const st=d._st;RM2=freshMods();G=baseG();G.K=st.K;G.Kmin=st.K;G.order=makeOrder(st.K);G.runLen=G.order.length;G.hero.pot=KAKU[st.K].pot;G.runT=0;G.ranks=[];const fl=st.fl===99?(G.order.push('hydra'),G.order.length):Math.min(st.fl,G.runLen);startBattle(fl-1,false);devAfter();return}
 if(a==='tut'){devStart();startTut(d._st.tut);closeDev();closeMenu();return}
 if(a==='unlock'){REC.k=REC.k||{};REC.beatFallen=1;for(let i=0;i<KAKU.length;i++)if(!REC.k[i])REC.k[i]={rank:'A',time:599};REC.seen=REC.seen||{};Object.keys(EN).forEach(k=>REC.seen[k]=1);saveRec();setTutDone();$('dvErr').textContent='すべて解放しました';return}
 if(a==='wipe'){if(!confirm('記録・解放・チュートリアル済みを消します'))return;try{['parryRPG.rec','parryRPG.tutDone','parryRPG.tips'].forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload();return}
 if(a==='reset'){DEF.forEach(x=>P[x.k]=x.v);save();try{syncOut()}catch(e){}devRender();$('dvErr').textContent='初期値に戻しました';return}
 if(a==='copy'){const j=$('dvJson');navigator.clipboard&&navigator.clipboard.writeText(j.value).then(()=>{$('dvErr').textContent='コピーしました'},()=>{j.select()});return}
 if(a==='load'){try{const n=applyJ(JSON.parse($('dvJson').value));save();try{syncOut()}catch(e){}devRender();$('dvErr').textContent=n+'項目を読み込みました'}catch(err){$('dvErr').textContent='読み込めませんでした'}return}
});
document.addEventListener('input',e=>{const t=e.target;if(!t.closest||!t.closest('#devp'))return;if(t.dataset.pk)devSet(t.dataset.pk,t.value);if(t.dataset.dbg){dbg[t.dataset.dbg]=t.checked;const m={bar:'dBar',slow:'dSlow',god:'dGod',fix:'dFix'}[t.dataset.dbg];if(m&&$(m))$(m).checked=t.checked}});
document.addEventListener('keydown',e=>{const d=$('devp');if(d&&!d.hidden&&e.key==='Enter'&&e.target.id==='dvPw'){e.preventDefault();d.querySelector('[data-dv="pw"]').click()}},true);

/* ===== 起動 ===== */
layout();buildPanel();applyDev();toTitle();
document.addEventListener('pointerdown',ev=>{const b=ev.target.closest&&ev.target.closest('button,.it,.row,[data-dv],select,label,input[type=checkbox],input[type=range]');if(!b||b.matches('.cm,#def'))return;try{ac()}catch(_){}SFX.ui()},true);
let acc=0,last=performance.now();
function loop(now){let dt=Math.min(100,now-last);last=now;if(dbg.slow)dt/=4;if(G.state==='ko'&&G.stop<=0&&G.t<koSlowLen())dt/=3;if(assistSlow())dt/=P.tutSlow;if(proSlow())dt/=2.5;acc+=dt;let n=0;while(acc>=1000/60&&n<6){acc-=1000/60;if((!MENU||G.mode==='title')&&!G.card){try{tick()}catch(err){loopErr(err)}}n++}try{draw()}catch(err){loopErr(err)}try{bgmTick()}catch(_){}requestAnimationFrame(loop)}
function loopErr(err){if(!window.__lErr){window.__lErr=1;console.error(err);setTimeout(()=>window.__lErr=0,2000)}}
requestAnimationFrame(loop);
}
</script>
</body>
</html>
